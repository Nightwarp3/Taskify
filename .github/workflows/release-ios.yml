name: Build and Release iOS

# Stubbed — activate when Apple Developer account is ready.
# Change trigger from workflow_dispatch to push.tags once signing secrets are set.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.3)'
        required: true

# Required secrets (add in repo Settings → Secrets → Actions):
#   APPLE_CERTIFICATE_BASE64       — base64-encoded .p12 signing certificate
#   APPLE_CERTIFICATE_PASSWORD     — .p12 password
#   APPLE_PROVISIONING_PROFILE     — base64-encoded .mobileprovision
#   APPLE_CONNECT_API_KEY          — App Store Connect API key JSON (for TestFlight upload)

jobs:
  ios:
    runs-on: macos-latest
    environment: Release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:web

      - name: Sync Capacitor iOS
        run: npx cap sync ios

