name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    environment: Release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history keeps release notes and generated metadata tied to the tag.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set package version for build
        run: npm pkg set version=${{ steps.version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npx electron-vite build && npx electron-builder --publish never

      - name: Normalize installer asset name
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Copy-Item "release/Taskify Setup $version.exe" "release/Taskify-Setup-$version.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Taskify ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/Taskify-Setup-*.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
