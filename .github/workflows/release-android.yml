name: Build and Release Android

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  android:
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          fi

      - name: Build APK (release)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/keystore.jks \
              -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            echo "No signing secrets configured — building unsigned debug APK"
            ./gradlew assembleDebug
          fi

      - name: Build AAB (release)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/keystore.jks \
              -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            echo "No signing secrets configured — skipping AAB (requires signed release)"
          fi

      - name: Rename and collect artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dist-android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               dist-android/Taskify-${TAG}.apk
            cp android/app/build/outputs/bundle/release/app-release.aab \
               dist-android/Taskify-${TAG}.aab
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk \
               dist-android/Taskify-${TAG}-debug.apk
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
